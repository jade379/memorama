<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memorama de Caricaturas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #FF1493; /* Rosa intenso */
        }
        .contenedor {
            background-color: #FFFF00; /* Amarillo brillante */
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px #000000;
            text-align: center;
            border: 5px solid #0000FF; /* Azul fuerte */
        }
        h1 {
            color: #FF4500; /* Naranja rojizo */
            font-size: 32px;
            text-shadow: 2px 2px #000000;
            margin-top: 0;
        }
        .tablero {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 20px auto;
            max-width: 480px;
        }
        .tarjeta {
            width: 100px;
            height: 100px;
            background-color: #00BFFF; /* Azul cielo intenso */
            border: 4px solid #8B008B; /* Morado oscuro */
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            color: #FFFFFF;
            font-weight: bold;
            transition: transform 0.3s ease;
        }
        .tarjeta.descubierta {
            background-color: #32CD32; /* Verde lima */
            transform: rotateY(180deg);
        }
        .tarjeta.acertada {
            background-color: #FF0000; /* Rojo intenso */
            border-color: #000000;
            cursor: default;
        }
        button {
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
            background-color: #7FFF00; /* Verde chartreuse */
            color: #000000;
            border: 3px solid #FF00FF; /* Fucsia */
            border-radius: 8px;
            font-weight: bold;
        }
        button:hover {
            background-color: #00FA9A; /* Verde primavera */
        }
        #mensaje {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            background-color: #00FFFF; /* Cian brillante */
            color: #000000;
            border: 3px solid #FF8C00; /* Naranja oscuro */
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>🎨 MEMORAMA DE CARICATURAS 🎨</h1>
        <div class="tablero" id="tablero"></div>
        <button onclick="reiniciarJuego()">🔄 Reiniciar Juego</button>
        <div id="mensaje">¡Encuentra todas las parejas! 🧩</div>
    </div>

    <script>
        // Emojis de caricaturas infantiles
        const imagenes = ['🐱', '🐶', '🐭', '🐰', '🐸', '🐵', '🐯', '🐻'];
        let cartas = [...imagenes, ...imagenes]; // Duplicar para formar parejas
        let cartasVolteadas = [];
        let cartasAcertadas = [];
        let bloqueoTablero = false;

        // Mezclar cartas
        function mezclar(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        // Crear tablero
        function crearTablero() {
            const tablero = document.getElementById('tablero');
            tablero.innerHTML = '';
            cartas = mezclar(cartas);
            
            cartas.forEach((imagen, indice) => {
                const tarjeta = document.createElement('div');
                tarjeta.classList.add('tarjeta');
                tarjeta.dataset.indice = indice;
                tarjeta.dataset.imagen = imagen;
                tarjeta.onclick = () => voltearTarjeta(tarjeta);
                tablero.appendChild(tarjeta);
            });
        }

        // Voltear tarjeta
        function voltearTarjeta(tarjeta) {
            // Evitar voltear si está bloqueado, ya está acertada o es la misma tarjeta
            if (bloqueoTablero || tarjeta.classList.contains('acertada') || cartasVolteadas.length.includes(tarjeta)) return;

            tarjeta.classList.add('descubierta');
            tarjeta.textContent = tarjeta.dataset.imagen;
            cartasVolteadas.push(tarjeta);

            // Comprobar si hay dos cartas volteadas
            if (cartasVolteadas.length === 2) {
                bloqueoTablero = true;
                comprobarPareja();
            }
        }

        // Comprobar si las dos cartas son iguales
        function comprobarPareja() {
            const [tarjeta1, tarjeta2] = cartasVolteadas;
            const esIgual = tarjeta1.dataset.imagen === tarjeta2.dataset.imagen;

            if (esIgual) {
                tarjeta1.classList.add('acertada');
                tarjeta2.classList.add('acertada');
                cartasAcertadas.push(tarjeta1, tarjeta2);
                cartasVolteadas = [];
                bloqueoTablero = false;

                // Verificar si se terminó el juego
                if (cartasAcertadas.length === cartas.length) {
                    document.getElementById('mensaje').textContent = '🎉 ¡GANASTE! 🎉 Lo hiciste genial';
                    document.getElementById('mensaje').style.backgroundColor = '#FF0000';
                    document.getElementById('mensaje').style.color = '#FFFFFF';
                }
            } else {
                // Voltear de nuevo después de un momento
                setTimeout(() => {
                    tarjeta1.classList.remove('descubierta');
                    tarjeta1.textContent = '';
                    tarjeta2.classList.remove('descubierta');
                    tarjeta2.textContent = '';
                    cartasVolteadas = [];
                    bloqueoTablero = false;
                }, 1000);
            }
        }

        // Reiniciar juego
        function reiniciarJuego() {
            cartasVolteadas = [];
            cartasAcertadas = [];
            bloqueoTablero = false;
            document.getElementById('mensaje').textContent = '¡Encuentra todas las parejas! 🧩';
            document.getElementById('mensaje').style.backgroundColor = '#00FFFF';
            document.getElementById('mensaje').style.color = '#000000';
            crearTablero();
        }

        // Iniciar juego al cargar
        crearTablero();
    </script>
</body>
</html>
